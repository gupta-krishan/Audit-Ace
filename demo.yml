name: Demo run
on:
  workflow_dispatch:
  push:
    branches: [main]
jobs:
  demo:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - name: Generate sample invoice, credit note and register
        run: |
          python agent.py new --json samples/invoice.json --yes
          python agent.py new --json samples/credit_note.json --yes
          python agent.py register
      - uses: actions/upload-artifact@v4
        with:
          name: sample-output
          path: out/
